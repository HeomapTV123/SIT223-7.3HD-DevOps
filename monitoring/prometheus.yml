global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    project: sit223-taskboard
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        ca_file: /etc/monitoring/ca/ca.crt
      static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: taskboard-production
    static_configs:
      - targets: [sit223-hd-production:3000]
        labels:
          environment: production
  - job_name: prometheus
    scheme: https
    tls_config:
      ca_file: /etc/monitoring/ca/ca.crt
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    scheme: https
    tls_config:
      ca_file: /etc/monitoring/ca/ca.crt
    static_configs:
      - targets: [alertmanager:9093]
