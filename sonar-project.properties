# Public project identifiers. The secret token comes from Jenkins credentials.
sonar.projectKey=HeomapTV123_SIT223-7.3HD-DevOps
sonar.organization=heomaptv123
sonar.host.url=https://sonarcloud.io
sonar.projectName=SIT223-7.3HD-DevOps
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.links.scm=https://github.com/HeomapTV123/SIT223-7.3HD-DevOps

# Analyse application and helper code, with tests classified separately.
# Untested source files remain in scope so the overall coverage is honest.
sonar.sources=src,public,scripts
sonar.tests=test
sonar.javascript.lcov.reportPaths=reports/lcov.info

# A successful upload alone is insufficient: Jenkins must wait for the gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
