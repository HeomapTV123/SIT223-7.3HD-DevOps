name: sit223-hd-monitoring
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    container_name: sit223-hd-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.external-url=http://localhost:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - production
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    container_name: sit223-hd-alertmanager
    command:
      - --config.file=/etc/alertmanager/private/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.external-url=http://localhost:9093
      - --enable-feature=receiver-name-in-metrics
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - private-config:/etc/alertmanager/private:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    container_name: sit223-hd-grafana
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  production:
    external: true
    name: sit223-hd-production_default
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  private-config:
    external: true
    name: sit223-hd-monitoring_private-config
