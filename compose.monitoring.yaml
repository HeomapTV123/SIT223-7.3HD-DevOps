name: sit223-hd-monitoring
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    container_name: sit223-hd-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.external-url=https://localhost:9090
      - --web.config.file=/etc/prometheus/web.yml
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
      - tls-prometheus:/etc/monitoring/tls:ro
      - tls-public:/etc/monitoring/ca:ro
    networks:
      - default
      - production
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    container_name: sit223-hd-alertmanager
    command:
      - --config.file=/etc/alertmanager/private/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.external-url=https://localhost:9093
      - --web.config.file=/etc/monitoring/web.yml
      - --enable-feature=receiver-name-in-metrics
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - private-config:/etc/alertmanager/private:ro
      - alertmanager-data:/alertmanager
      - ./monitoring/web.yml:/etc/monitoring/web.yml:ro
      - tls-alertmanager:/etc/monitoring/tls:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    container_name: sit223-hd-grafana
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_ROOT_URL: https://localhost:3003
      GF_SERVER_CERT_FILE: /etc/monitoring/tls/server.crt
      GF_SERVER_CERT_KEY: /etc/monitoring/tls/server.key
      GF_SERVER_MIN_TLS_VERSION: TLS1.2
      GF_SECURITY_COOKIE_SECURE: "true"
      SSL_CERT_FILE: /etc/monitoring/ca/ca.crt
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Use the plugins bundled in the pinned, read-only image.
      # Update notices and the background installer have separate controls.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - tls-grafana:/etc/monitoring/tls:ro
      - tls-public:/etc/monitoring/ca:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  production:
    external: true
    name: sit223-hd-production_default
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  private-config:
    external: true
    name: sit223-hd-monitoring_private-config
  tls-public:
    external: true
    name: sit223-hd-monitoring_tls-public
  tls-prometheus:
    external: true
    name: sit223-hd-monitoring_tls-prometheus
  tls-alertmanager:
    external: true
    name: sit223-hd-monitoring_tls-alertmanager
  tls-grafana:
    external: true
    name: sit223-hd-monitoring_tls-grafana
